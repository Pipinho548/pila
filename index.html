<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pila</title>
  <meta name="description" content="Controle financeiro pessoal">
  <meta name="theme-color" id="cor-tema" content="#06100d">
  <script>
    // Tema e "esconder valores" antes de desenhar a tela (sem piscar)
    (() => {
      let tema = 'escuro';
      try { tema = localStorage.getItem('pila-tema') || 'escuro'; } catch { /* sem armazenamento */ }
      document.documentElement.dataset.tema = tema;
      try { if (localStorage.getItem('pila-esconder') === '1') document.documentElement.classList.add('esconder-valores'); } catch { /* ok */ }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pila">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login -->
  <section id="tela-login" class="login" hidden>
    <div class="login-caixa">
      <h1 class="login-logo">
        <img class="logo-claro" src="img/logo.png" alt="Pila" width="208" height="72">
        <img class="logo-escuro" src="img/logo-escuro.png" alt="Pila" width="208" height="72">
      </h1>
      <p class="sub">Seu dinheiro em 5 segundos.</p>

      <p id="aviso-config" class="aviso" hidden>
        Falta conectar o Supabase. Preencha o arquivo <code>js/config.js</code>.
      </p>

      <form id="form-login" autocomplete="on">
        <label>E-mail
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>Senha
          <input type="password" name="senha" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn-primario">Entrar</button>
        <p id="erro-login" class="erro" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="barra-topo">
      <a href="#hoje" class="marca" aria-label="Pila, ir pra Hoje">
        <svg class="simbolo" viewBox="0 0 32 30" aria-hidden="true">
          <path class="folha-palha" d="M19 0H24.5Q26 0 26 1.5V3A5 5 0 0 1 21 8H15.5Q14 8 14 6.5V5A5 5 0 0 1 19 0Z"/>
          <path class="folha-erva" d="M13 10H25.5Q27 10 27 11.5V12A6 6 0 0 1 21 18H8.5Q7 18 7 16.5V16A6 6 0 0 1 13 10Z"/>
          <path class="folha-pinheiro" d="M8 20H26.5Q28 20 28 21.5V23A6 6 0 0 1 22 29H3.5Q2 29 2 27.5V26A6 6 0 0 1 8 20Z"/>
        </svg>
        <span class="marca-nome">pila<span class="marca-ponto">.</span></span>
      </a>
      <button type="button" id="btn-olho" class="btn-olho" aria-pressed="false" aria-label="Esconder valores">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="olho-aberto"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="olho-fechado"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </header>

    <main id="conteudo"></main>

    <div class="dock">
    <nav class="abas" aria-label="Navegação">
      <a href="#hoje" data-aba="hoje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Hoje</span>
      </a>
      <a href="#mes" data-aba="mes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Mês</span>
      </a>
      <a href="#dividas" data-aba="dividas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Dívidas</span>
      </a>
      <a href="#comprar" data-aba="comprar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span>Comprar</span>
      </a>
      <a href="#mais" data-aba="mais">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
        <span>Mais</span>
      </a>
    </nav>
    <button id="btn-lancar" class="btn-lancar" aria-label="Lançar gasto">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    </div>
  </div>

  <!-- Folha de lançar gasto -->
  <dialog id="folha-lancar" class="folha">
    <form id="form-lancar" class="form" novalidate>
      <div class="folha-topo">
        <h2>Lançar gasto</h2>
        <button type="button" class="btn-fechar" data-fechar aria-label="Fechar">✕</button>
      </div>
      <label class="campo-valor">
        <span aria-hidden="true">R$</span>
        <input name="valor" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-label="Valor">
      </label>
      <div class="chips" id="lancar-categorias" role="radiogroup" aria-label="Categoria"></div>
      <fieldset class="segmentado">
        <legend>Meio</legend>
        <label><input type="radio" name="meio" value="pix" checked><span>Pix</span></label>
        <label><input type="radio" name="meio" value="debito"><span>Débito</span></label>
        <label><input type="radio" name="meio" value="cartao"><span>Cartão</span></label>
        <label><input type="radio" name="meio" value="dinheiro"><span>Dinheiro</span></label>
      </fieldset>
      <fieldset class="segmentado" id="lancar-regra" hidden>
        <legend>Conta como</legend>
        <label><input type="radio" name="regra" value="outra" checked><span>Gasto de agora</span></label>
        <label><input type="radio" name="regra" value="assinatura"><span>Assinatura</span></label>
      </fieldset>
      <p id="lancar-dica" class="nota" hidden></p>
      <div class="extras">
        <input name="descricao" placeholder="Descrição (opcional)" autocomplete="off" aria-label="Descrição">
        <input name="data" type="date" aria-label="Data">
      </div>
      <button type="submit" class="btn-primario">Lançar</button>
      <p id="lancar-erro" class="erro" role="alert"></p>
    </form>
  </dialog>

  <!-- Folha de uma conta do mês -->
  <dialog id="folha-item" class="folha"></dialog>

  <!-- Folha de um lançamento (editar ou apagar) -->
  <dialog id="folha-editar" class="folha"></dialog>

  <!-- Folha de pagar fatura e de guardar/resgatar -->
  <dialog id="folha-geral" class="folha"></dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
