<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pila</title>
  <meta name="description" content="Controle financeiro pessoal">
  <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pila">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login -->
  <section id="tela-login" class="login" hidden>
    <div class="login-caixa">
      <img src="icons/icon-192.png" alt="" class="login-logo" width="72" height="72">
      <h1>Pila</h1>
      <p class="sub">Seu dinheiro em 5 segundos.</p>

      <p id="aviso-config" class="aviso" hidden>
        Falta conectar o Supabase. Preencha o arquivo <code>js/config.js</code>.
      </p>

      <form id="form-login" autocomplete="on">
        <label>E-mail
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>Senha
          <input type="password" name="senha" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn-primario">Entrar</button>
        <p id="erro-login" class="erro" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <main id="conteudo"></main>

    <button id="btn-lancar" class="fab" aria-label="Lançar gasto">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>

    <nav class="abas" aria-label="Navegação">
      <a href="#hoje" data-aba="hoje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Hoje</span>
      </a>
      <a href="#mes" data-aba="mes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Mês</span>
      </a>
      <a href="#dividas" data-aba="dividas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Dívidas</span>
      </a>
      <a href="#metas" data-aba="metas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
        <span>Metas</span>
      </a>
      <a href="#mais" data-aba="mais">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
        <span>Mais</span>
      </a>
    </nav>
  </div>

  <!-- Folha de lançar gasto -->
  <dialog id="folha-lancar" class="folha">
    <div class="folha-topo">
      <h2>Lançar gasto</h2>
      <button type="button" class="btn-fechar" data-fechar aria-label="Fechar">✕</button>
    </div>
    <p class="vazio">O lançamento chega na Fase 2.</p>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
